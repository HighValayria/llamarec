stage: cross-dataset-validation
dataset:
  key: amazon-books
  selected_by_user: true
  raw_dir: data/raw/Amazon-books
  current_gate_status: blocked_requires_review_interaction_log
goal: >
  Validate whether MovieLens-1M task-interface, specialist-vs-unified, harder
  candidate, and SASRec sample-efficiency findings transfer to a second
  dataset.
required_data_contract:
  interaction_rows:
    required: true
    fields:
      - user_id
      - item_id
      - rating
      - timestamp
  item_metadata:
    required: true
    fields:
      - item_id
      - title
current_amazon_books_catalog:
  usable_as_item_metadata: true
  usable_as_interactions: false
candidate_protocols_when_unblocked:
  random_k5:
    candidate_num: 5
    candidate_seed: 42
  popmatch_k5:
    candidate_num: 5
    candidate_seed: 42
    popularity_source: training_split_interactions_only
seed42_matrix_when_unblocked:
  - Base
  - Y-K0
  - N-K0
  - M1
  - SASRec-exp-match
forbidden:
  - KAR
  - review_text_augmentation
  - product_description_augmentation
  - hard_negative_training
  - new_M_variant
  - LoRA_sweep
  - 7B_model
  - third_dataset
